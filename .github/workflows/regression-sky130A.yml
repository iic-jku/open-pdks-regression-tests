# Description: sky130A regression and PEX bench in the IIC-OSIC-TOOLS container on every change of main and on manual dispatch. The job itself is in regression-common.yml.

name: Regression sky130A

on:
  # No schedule: the IIC-OSIC-TOOLS test every nightly image against main themselves (tests 26, 31, 35, 47, and 48), so this workflow checks the changes made here.
  # Documentation changes need no run.
  push:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - 'doc/**'
  pull_request:
    branches:
      - 'main'
    paths-ignore:
      - '**.md'
      - 'doc/**'
  workflow_dispatch:
    inputs:
      image:
        description: 'IIC-OSIC-TOOLS image, for example hpretl/iic-osic-tools:2026.11'
        type: string
        default: ghcr.io/iic-jku/iic-osic-tools:nightly

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    uses: ./.github/workflows/regression-common.yml
    with:
      pdk: sky130A
      # Empty on push and pull request runs, regression-common.yml then picks the nightly image.
      image: ${{ inputs.image }}
