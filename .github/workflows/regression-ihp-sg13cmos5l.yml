# Description: ihp-sg13cmos5l regression and PEX bench in the IIC-OSIC-TOOLS container, three times a week
# and on manual dispatch. The job itself is in regression-common.yml.

name: Regression ihp-sg13cmos5l

on:
  schedule:
    # Mon, Wed and Fri at 12:00 UTC. The IIC-OSIC-TOOLS nightly build is scheduled for 23:00 UTC
    # but starts hours later and takes about 3.5 h, so noon tests the image of that night.
    - cron: '0 12 * * 1,3,5'
  workflow_dispatch:
    inputs:
      image:
        description: 'IIC-OSIC-TOOLS image, for example hpretl/iic-osic-tools:2026.11'
        type: string
        default: ghcr.io/iic-jku/iic-osic-tools:nightly

permissions:
  contents: read

jobs:
  regression:
    uses: ./.github/workflows/regression-common.yml
    with:
      pdk: ihp-sg13cmos5l
      # Scheduled runs have no inputs and fall back to the nightly image.
      image: ${{ inputs.image || 'ghcr.io/iic-jku/iic-osic-tools:nightly' }}
